# Design system content: meaning, use and behaviour of each element.
# Measured values (sizes, colours, fonts) come from docs/spec/design/v<version>/ds.json,
# which spec/screens/ds-capture.js reads from the running app.

intro: >-
  The design system names every visual element of the app. New features must use these elements.
  Each element has an ID. The images and the values come from the running app, in light and dark mode.
  Values in px are CSS pixels at a phone width of 412 px.

colours:
  # token: [ID, name, use, rules]
  "--ink":      [DS-COL-01, Ink, "Main text, borders of strong elements, the parking place dot.", "Use for all body text."]
  "--muted":    [DS-COL-02, Muted text, "Secondary text, labels, hints.", "Do not use for text that the user must read to decide."]
  "--bg":       [DS-COL-03, Background, "Page background, input fields.", ""]
  "--surface":  [DS-COL-04, Surface, "Cards and sections.", ""]
  "--line":     [DS-COL-05, Line, "Card borders, dividers, borders of secondary buttons.", ""]
  "--sign":     [DS-COL-06, Action blue, "Primary buttons, pay button, focus ring, focused input border.", "Use only for actions and focus."]
  "--ok":       [DS-COL-07, Allowed blue, "Allowed state: verdict card border and mark, map lines, suggestion bars.", "Always together with the word 'park' or 'allowed'."]
  "--ok-soft":  [DS-COL-08, Allowed tint, "Fill of the allowed verdict card.", ""]
  "--no":       [DS-COL-09, Not-allowed orange, "Not-allowed verdict card border and mark.", "Always together with the diagonal stripes and the mark ✕."]
  "--no-soft":  [DS-COL-10, Not-allowed tint, "Stripes of the not-allowed card.", ""]
  "--stop":     [DS-COL-11, Map red, "Map lines of M sections where parking is not allowed at the start time.", "Use only on the map. Never pair with green."]
  "--ban-bg":   [DS-COL-12, Warning red, "Background of street cleaning warnings (soon).", "Always with --ban-fg text and the warning triangle."]
  "--ban-fg":   [DS-COL-13, Warning yellow, "Text and triangle on --ban-bg.", ""]
  "--road":     [DS-COL-14, Street, "Minor streets on the map.", ""]
  "--road-major": [DS-COL-15, Main street, "Main streets on the map.", ""]
  "--other":    [DS-COL-16, Other parking grey, "Dotted map lines of parking where the permit is not valid.", ""]
  "--halo":     [DS-COL-17, Halo, "Outline behind map text, so that text stays readable on lines.", ""]
  "--pin":      [DS-COL-18, Parking place, "The address dot on the map.", ""]

