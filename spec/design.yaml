  - [DS-TYP-03, Display M, "Overpass 900, 22.4 px (1.4rem)", "App title."]
  - [DS-TYP-04, Title, "Overpass 900, 20 px (1.25rem), line 1.15", "Card titles: Permit valid here, the address on My car."]
  - [DS-TYP-05, Body, "Overpass 400, 16 px, line 1.45", "Running text."]
  - [DS-TYP-06, Detail, "Overpass 400–800, 14.7 px (0.92rem)", "Lines under a verdict, key–value lists."]
  - [DS-TYP-07, Small, "Overpass 400–700, 13.1 px (0.82rem)", "Hints, legend, suggestion details."]
  - [DS-TYP-08, Section heading, "Overpass 800, 12.5 px (0.78rem), upper case, letter spacing 0.08 em, muted", "Headings of sections: LONGEST STAYS NEARBY."]
  - [DS-TYP-09, Mono label, "Overpass Mono 700–800, 11–15 px", "Codes, durations, map labels, cleaning badges, permit chip. Numbers use tabular figures."]

spacing:
