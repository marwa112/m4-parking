  - [DS-SPC-02, Section gap, "16 px", "Between sections, between cards in a result."]
  - [DS-SPC-03, Card padding, "16 px (sections), 14 px (verdict cards)", ""]
  - [DS-SPC-04, Control gap, "8–10 px", "Between buttons and fields in one row."]
  - [DS-SPC-05, Corner radius, "12 px sections · 10 px cards and primary buttons · 8 px fields and secondary buttons · 4–5 px labels and badges · 999 px pills", ""]
  - [DS-SPC-06, Content width, "600 px maximum", "The app is one column on every screen."]
  - [DS-SPC-07, Touch target, "40 px or more in height", "Every button and field. The zoom buttons are 40 × 40 px."]

